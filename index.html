<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Praça do Povo – Protesto Online</title>
<style>
:root{--ink:#1d1b18;--paper:#f3ede0;--red:#d62828;--yellow:#f5c518;--muted:#7a7467}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#2b2a26;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",sans-serif}
#lobby{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:repeating-linear-gradient(45deg,#2b2a26 0 18px,#302e29 18px 36px);overflow:auto;z-index:5}
.card{background:var(--paper);width:min(440px,100%);border:4px solid var(--ink);box-shadow:8px 8px 0 var(--ink);padding:22px}
h1{font-family:Impact,"Arial Black",sans-serif;font-size:40px;line-height:1;margin:0 0 4px;letter-spacing:1px}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 5px}
input[type=text]{width:100%;padding:10px;border:3px solid var(--ink);background:#fff;font-size:16px;font-family:inherit}
.opts{display:flex;gap:8px}
.opt{flex:1;padding:9px 6px;border:3px solid var(--ink);background:#fff;font:700 15px inherit;font-family:inherit;cursor:pointer}
.opt[aria-pressed=true]{background:var(--ink);color:#fff}
.opt.y[aria-pressed=true]{background:var(--yellow);color:var(--ink);box-shadow:inset 0 0 0 3px var(--ink)}
.opt.r[aria-pressed=true]{background:var(--red);color:#fff;box-shadow:inset 0 0 0 3px var(--ink)}
.opt:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid #1a73e8;outline-offset:2px}
#prev{display:block;margin:14px auto 0;image-rendering:pixelated;background:#9bbf7a;border:3px solid var(--ink)}
#go{width:100%;margin-top:16px;padding:14px;border:3px solid var(--ink);background:var(--ink);color:#fff;font:700 18px inherit;font-family:inherit;cursor:pointer}
#go:disabled{opacity:.5}
#err{color:var(--red);font-size:13px;margin:8px 0 0;min-height:16px}
#game{position:fixed;inset:0;display:none}
canvas#c{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;top:8px;left:8px;background:var(--paper);border:3px solid var(--ink);padding:6px 10px;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center}
.dot{display:inline-block;width:12px;height:12px;border:2px solid var(--ink);border-radius:50%;vertical-align:-2px;margin-right:3px}
#chat{position:fixed;right:8px;bottom:8px;width:min(330px,calc(100% - 16px));background:var(--paper);border:3px solid var(--ink);display:flex;flex-direction:column}
#log{height:150px;overflow-y:auto;padding:8px;font-size:13px;line-height:1.35}
#log p{margin:0 0 4px;word-wrap:break-word}
#log .sys{color:var(--muted);font-style:italic}
#chat form{display:flex;border-top:3px solid var(--ink)}
#msg{flex:1;border:0;padding:9px;font-size:15px;min-width:0;font-family:inherit}
#chat button{border:0;border-left:3px solid var(--ink);background:var(--ink);color:#fff;padding:0 12px;font-weight:700;cursor:pointer}
#acts{position:fixed;left:8px;bottom:8px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
#acts button{border:3px solid var(--ink);background:var(--paper);padding:9px 12px;font:700 14px inherit;font-family:inherit;cursor:pointer}
#pad{display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px}
#pad button{padding:0;font-size:20px}
#tools{position:fixed;top:50px;left:8px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 240px)}
@media (max-width:600px){#tools{max-width:calc(100% - 16px)}#truckp{bottom:166px!important}}
#tools button,#truckp button,#plist button{border:3px solid var(--ink);background:var(--paper);padding:7px 10px;font:700 13px inherit;font-family:inherit;cursor:pointer}
#truckp{display:none;position:fixed;right:8px;bottom:216px;width:min(330px,calc(100% - 16px));background:var(--paper);border:3px solid var(--ink);padding:10px;font-size:13px}
#truckp form{display:flex;margin:8px 0}#truckp form input{flex:1;min-width:0;padding:8px;border:3px solid var(--ink);font-size:14px;font-family:inherit}
#plist{display:none;position:fixed;top:130px;right:8px;width:240px;max-height:45vh;overflow:auto;background:var(--paper);border:3px solid var(--ink);padding:8px;font-size:13px}
#plist .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0}
@media (pointer:coarse){#pad{display:grid}}
#help{position:fixed;top:8px;right:8px;background:var(--paper);border:3px solid var(--ink);padding:6px 10px;font-size:12px;max-width:210px}
@media (max-width:600px){#help{display:none}#log{height:100px}}
</style>
</head>
<body>

<div id="lobby"><div class="card">
  <h1>PRAÇA DO POVO</h1>
  <p class="sub">Protesto pacífico online. Entre numa sala, escolha sua camisa e converse com os outros manifestantes.</p>
  <label for="nome">Seu nome</label>
  <input type="text" id="nome" maxlength="14" placeholder="Como quer ser chamado(a)?">
  <label for="sala">Sala</label>
  <input type="text" id="sala" maxlength="20" value="praca-central">
  <label>Personagem</label>
  <div class="opts"><button class="opt" data-g="h" aria-pressed="true">Homem</button><button class="opt" data-g="m" aria-pressed="false">Mulher</button></div>
  <label>Camisa</label>
  <div class="opts"><button class="opt y" data-c="y" aria-pressed="true">Amarela</button><button class="opt r" data-c="r" aria-pressed="false">Vermelha</button></div>
  <label for="cartaz">Texto do seu cartaz</label>
  <input type="text" id="cartaz" maxlength="16" value="VOZ DO POVO">
  <label>Bandeira</label>
  <div class="opts"><button class="opt" data-f="" aria-pressed="true">Nenhuma</button><button class="opt" data-f="br" aria-pressed="false">Brasil</button><button class="opt r" data-f="pt" aria-pressed="false">Vermelha</button></div>
  <canvas id="prev" width="96" height="96" style="width:96px;height:96px"></canvas>
  <div id="err" role="alert"></div>
  <button id="go">Entrar na sala</button>
</div></div>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud"><span id="sl"></span><span><span class="dot" style="background:var(--yellow)"></span><b id="ny">0</b></span><span><span class="dot" style="background:var(--red)"></span><b id="nr">0</b></span></div>
  <div id="help">Setas ou WASD para andar.<br>E levanta o cartaz.<br>Enter abre o chat.</div>
  <div id="acts">
    <div id="pad"><span></span><button data-k="up">▲</button><span></span><button data-k="left">◀</button><span></span><button data-k="right">▶</button><span></span><button data-k="down">▼</button><span></span></div>
  </div>
  <div id="tools"><button id="bSign">✊ Cartaz (E)</button><button id="bFlag">🚩 Bandeira: nenhuma</button><button id="bMic">🎤 Microfone: mutado</button><button id="bList">👥 Jogadores</button><button id="bTrk">🔊 Carros: ligados</button></div>
  <div id="plist"></div>
  <div id="truckp"><b id="tnome"></b><div id="tstat"></div><form id="tf"><input type="text" id="turl" placeholder="Link do YouTube" autocomplete="off"><button>Tocar</button></form><button id="tstop" type="button">Parar música</button></div>
  <div id="chat"><div id="log" aria-live="polite"></div>
    <form id="f"><input id="msg" maxlength="80" placeholder="Escreva e aperte Enter" autocomplete="off"><button>Enviar</button></form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDJBdK9I-jtg9ujTc9Xsxr-hnPfkId4wIU",
  authDomain: "pdv1-77632.firebaseapp.com",
  databaseURL: "https://pdv1-77632-default-rtdb.firebaseio.com",
  projectId: "pdv1-77632",
  storageBucket: "pdv1-77632.firebasestorage.app",
  messagingSenderId: "246033791117",
  appId: "1:246033791117:web:7b70b511ea8d8c5ba1cac4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const COLORS = {y:"#f5c518", r:"#d62828"};
const $ = id => document.getElementById(id);
const sel = {g:"h", c:"y", f:""};
const WW = 1600, WH = 1200;

/* ---------- Personagem ---------- */
function drawChar(ctx, x, y, p, walk, t){
  const bob = walk ? Math.sin(t/90)*2 : 0;
  const leg = walk ? Math.sin(t/90)*4 : 0;
  ctx.fillStyle = "rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x, y+2, 13, 5, 0, 0, 7); ctx.fill();
  const skin = "#e0ac82", hair = p.g === "m" ? "#4a2b17" : "#1f1a17";
  if (p.g === "m"){ ctx.fillStyle = hair; ctx.fillRect(x-9, y-34+bob, 18, 22); } // cabelo longo atrás
  ctx.fillStyle = p.g === "m" ? "#3b3f5c" : "#2d3142";
  ctx.fillRect(x-7, y-12, 6, 12+leg/2); ctx.fillRect(x+1, y-12, 6, 12-leg/2);
  ctx.fillStyle = COLORS[p.c]; ctx.fillRect(x-9, y-28+bob, 18, 18);
  ctx.strokeStyle = "#1d1b18"; ctx.lineWidth = 2; ctx.strokeRect(x-9, y-28+bob, 18, 18);
  ctx.fillStyle = skin; ctx.fillRect(x-12, y-26+bob, 4, 11); ctx.fillRect(x+8, y-26+bob, 4, 11);
  ctx.beginPath(); ctx.arc(x, y-36+bob, 8, 0, 7); ctx.fill(); ctx.stroke();
  ctx.fillStyle = hair; ctx.beginPath(); ctx.arc(x, y-39+bob, 8, Math.PI, 0); ctx.fill();
  if (p.g === "m") ctx.fillRect(x-8, y-40+bob, 3, 12);
  ctx.fillStyle = "#1d1b18"; ctx.fillRect(x-4, y-36+bob, 2, 2); ctx.fillRect(x+2, y-36+bob, 2, 2);
}
function drawPreview(){
  const c = $("prev").getContext("2d"); c.clearRect(0,0,96,96);
  c.save(); c.scale(1.6,1.6); drawChar(c, 30, 52, sel, false, 0); c.restore();
}

/* ---------- Mapa ---------- */
const buildings = [];
const palette = ["#b9a089","#a3b1c2","#c9b6a0","#9fb5a1","#c4a3a3","#b8b0cc"];
function block(x,y,w,h,seed){
  for (let i=0;i<3;i++) buildings.push({x:x+i*(w/3)+10,y:y+30,w:w/3-20,h:h-60,c:palette[(seed+i)%6]});
}
block(20,20,640,460,0); block(940,20,640,460,2); block(20,720,640,460,4); block(940,720,640,460,1);
buildings.push({x:760,y:560,w:80,h:80,c:"#8a8f94",fountain:true});
const trees = [[690,500],[910,500],[690,700],[910,700],[720,660],[880,540]];

function drawMap(ctx, cam){
  ctx.fillStyle = "#8fb56e"; ctx.fillRect(0,0,WW,WH);
  ctx.fillStyle = "#55575c"; ctx.fillRect(0,520,WW,160); ctx.fillRect(700,0,200,WH);
  ctx.fillStyle = "#e8e2cf";
  for (let x=0;x<WW;x+=60) if (x<690||x>910) ctx.fillRect(x,597,34,6);
  for (let y=0;y<WH;y+=60) if (y<510||y>690) ctx.fillRect(797,y,6,34);
  ctx.fillStyle = "#cfc6ab"; ctx.fillRect(690,510,220,180); // praça
  ctx.strokeStyle = "#1d1b18"; ctx.lineWidth = 3; ctx.strokeRect(690,510,220,180);
  for (const b of buildings){
    if (b.fountain){
      ctx.fillStyle = "#7fb7d6"; ctx.beginPath(); ctx.arc(800,600,40,0,7); ctx.fill(); ctx.stroke(); continue;
    }
    ctx.fillStyle = "rgba(0,0,0,.2)"; ctx.fillRect(b.x+8,b.y+8,b.w,b.h);
    ctx.fillStyle = b.c; ctx.fillRect(b.x,b.y,b.w,b.h); ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle = "#2f3a45";
    for (let wy=b.y+16; wy<b.y+b.h-40; wy+=34) for (let wx=b.x+14; wx<b.x+b.w-22; wx+=34) ctx.fillRect(wx,wy,16,20);
    ctx.fillStyle = "#6b4a2f"; ctx.fillRect(b.x+b.w/2-12,b.y+b.h-26,24,26);
  }
  for (const [tx,ty] of trees){
    ctx.fillStyle = "#4d7a3a"; ctx.beginPath(); ctx.arc(tx,ty,20,0,7); ctx.fill(); ctx.stroke();
  }
}
const hit = (x,y) => x<14||y<14||x>WW-14||y>WH-14 || TRUCKS.some(k => Math.abs(x-k.x)<k.w/2+10 && Math.abs(y-k.y)<k.h/2+10) || buildings.some(b => x>b.x-10&&x<b.x+b.w+10&&y>b.y&&y<b.y+b.h+12);

/* ---------- Estado ---------- */
let me, room, myRef, players = {}, keys = {}, lastSend = 0, dirty = false, chatting = false;
const cv = $("c"), ctx = cv.getContext("2d");
function resize(){ cv.width = innerWidth; cv.height = innerHeight; }
addEventListener("resize", resize);

/* ---------- Lobby ---------- */
document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => {
  sel.g = b.dataset.g; document.querySelectorAll("[data-g]").forEach(x => x.setAttribute("aria-pressed", x===b)); drawPreview();
});
document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
  sel.c = b.dataset.c; document.querySelectorAll("[data-c]").forEach(x => x.setAttribute("aria-pressed", x===b)); drawPreview();
});
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  sel.f = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x===b));
});
drawPreview();

$("go").onclick = async () => {
  const nome = $("nome").value.trim();
  const sala = $("sala").value.trim().toLowerCase().replace(/[^a-z0-9-_]/g,"-");
  if (!nome) { $("err").textContent = "Digite seu nome para entrar."; return; }
  if (!sala) { $("err").textContent = "Digite o nome de uma sala."; return; }
  $("go").disabled = true; $("err").textContent = "";
  try { await start(nome, sala, $("cartaz").value.trim().toUpperCase() || "VOZ DO POVO"); }
  catch(e){ $("err").textContent = "Não foi possível conectar ao Firebase. Confira as regras do banco de dados."; $("go").disabled = false; console.error(e); }
};

async function start(nome, sala, sg){
  room = sala;
  const base = db.ref("salas/" + room);
  myRef = base.child("jogadores").push();
  me = {id: myRef.key, n: nome, g: sel.g, c: sel.c, f: sel.f, mic: 0, sg, s: 0, x: 720+Math.random()*160, y: 668+Math.random()*14, m: 0, msg: "", mt: 0, hb: Date.now()};
  await myRef.set(me);
  myRef.onDisconnect().remove();
  const chatRef = base.child("chat");
  chatRef.push({sys: 1, t: nome + " entrou na manifestação", ts: Date.now()});

  initExtras(base);
  base.child("jogadores").on("child_added", s => upsert(s.key, s.val()));
  base.child("jogadores").on("child_changed", s => upsert(s.key, s.val()));
  base.child("jogadores").on("child_removed", s => { const o = players[s.key]; if (o && s.key !== me.id) addLog({sys:1,t:o.n+" saiu"}); delete players[s.key]; closePeer(s.key); count(); });
  const joinedAt = Date.now();
  chatRef.limitToLast(40).on("child_added", s => addLog(s.val()));

  $("lobby").style.display = "none"; $("game").style.display = "block";
  $("sl").textContent = "Sala: " + room;
  resize(); count();
  setInterval(() => { me.hb = Date.now(); myRef.update({hb: me.hb}); }, 15000);
  requestAnimationFrame(loop);
}

function upsert(id, d){
  const isNew = !players[id];
  const o = players[id] || (players[id] = {x: d.x, y: d.y, bt: -1e9});
  if (id === me.id) { o.x = me.x; o.y = me.y; }
  if (d.mt !== o.mt && d.msg) o.bt = performance.now();
  Object.assign(o, d, {tx: d.x, ty: d.y});
  if (id === me.id){ o.x = me.x; o.y = me.y; }
  if (isNew && id !== me.id && me.id > id) chamar(id);
  count();
}
function count(){
  let y=0,r=0; for (const k in players){ players[k].c === "y" ? y++ : r++; }
  $("ny").textContent = y; $("nr").textContent = r; renderList();
}

/* ---------- Chat ---------- */
function addLog(m){
  if (m.u && mutedIds.has(m.u)) return;
  const p = document.createElement("p");
  if (m.sys){ p.className = "sys"; p.textContent = m.t; }
  else {
    const b = document.createElement("b"); b.textContent = m.n + ": "; b.style.color = m.c === "r" ? "#b01e1e" : "#9a7a00";
    p.appendChild(b); p.appendChild(document.createTextNode(m.t));
  }
  const l = $("log"); l.appendChild(p); while (l.children.length > 60) l.firstChild.remove(); l.scrollTop = l.scrollHeight;
}
$("f").onsubmit = e => {
  e.preventDefault();
  const t = $("msg").value.trim(); if (!t) return;
  $("msg").value = "";
  db.ref("salas/" + room + "/chat").push({n: me.n, u: me.id, c: me.c, t, ts: Date.now()});
  me.msg = t; me.mt = Date.now();
  myRef.update({msg: me.msg, mt: me.mt});
  players[me.id].bt = performance.now(); players[me.id].msg = t; players[me.id].mt = me.mt;
};
addEventListener("focusin", e => { if (e.target.tagName === "INPUT"){ chatting = true; keys = {}; } });
addEventListener("focusout", () => chatting = false);

/* ---------- Controles ---------- */
const MAP = {ArrowUp:"up",w:"up",W:"up",ArrowDown:"down",s:"down",S:"down",ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right"};
addEventListener("keydown", e => {
  if (chatting){ if (e.key === "Escape") $("msg").blur(); return; }
  if (e.key === "Enter"){ e.preventDefault(); $("msg").focus(); return; }
  if (e.key === "e" || e.key === "E"){ toggleSign(); return; }
  if (MAP[e.key]){ keys[MAP[e.key]] = true; e.preventDefault(); }
});
addEventListener("keyup", e => { if (MAP[e.key]) keys[MAP[e.key]] = false; });
document.querySelectorAll("#pad button").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { e.preventDefault(); keys[k] = true; });
  ["pointerup","pointerleave","pointercancel"].forEach(ev => b.addEventListener(ev, () => keys[k] = false));
});
$("bSign").onclick = toggleSign;
function toggleSign(){ me.s = me.s ? 0 : 1; dirty = true; }

/* ---------- Loop ---------- */
let last = performance.now();
function loop(t){
  const dt = Math.min(.05, (t-last)/1000); last = t;
  let dx = (keys.right?1:0) - (keys.left?1:0), dy = (keys.down?1:0) - (keys.up?1:0);
  me.m = dx || dy ? 1 : 0;
  if (me.m){
    const len = Math.hypot(dx,dy), sp = (me.s ? 90 : 170) * dt;
    const nx = me.x + dx/len*sp, ny = me.y + dy/len*sp;
    const stuck = hit(me.x, me.y);
    if (stuck || !hit(nx, me.y)) me.x = nx;
    if (stuck || !hit(me.x, ny)) me.y = ny;
    dirty = true;
  } else if (me.wasMoving) dirty = true;
  me.wasMoving = me.m;
  if (dirty && t - lastSend > 90){
    lastSend = t; dirty = false;
    myRef.update({x: Math.round(me.x), y: Math.round(me.y), m: me.m, s: me.s});
  }
  const mine = players[me.id]; if (mine){ mine.x = me.x; mine.y = me.y; mine.s = me.s; mine.m = me.m; }
  for (const k in players){
    const o = players[k]; if (k === me.id) continue;
    o.x += (o.tx - o.x) * Math.min(1, dt*10); o.y += (o.ty - o.y) * Math.min(1, dt*10);
  }
  updTrucks(t); render(t); requestAnimationFrame(loop);
}

function bubble(c, text, x, y){
  c.font = "bold 13px Trebuchet MS"; const w = Math.min(190, c.measureText(text).width) + 16;
  const t = text.length > 28 ? text.slice(0,27) + "…" : text; const tw = c.measureText(t).width + 16;
  c.fillStyle = "#fff"; c.strokeStyle = "#1d1b18"; c.lineWidth = 2;
  c.beginPath(); c.roundRect(x-tw/2, y-26, tw, 24, 8); c.fill(); c.stroke();
  c.beginPath(); c.moveTo(x-5,y-2); c.lineTo(x,y+6); c.lineTo(x+5,y-2); c.fill();
  c.fillStyle = "#1d1b18"; c.textAlign = "center"; c.fillText(t, x, y-9);
}

function render(t){
  const mine = players[me.id]; if (!mine) return;
  const camX = Math.max(0, Math.min(WW - cv.width, mine.x - cv.width/2));
  const camY = Math.max(0, Math.min(WH - cv.height, mine.y - cv.height/2));
  ctx.fillStyle = "#2b2a26"; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.save(); ctx.translate(-Math.round(camX), -Math.round(camY));
  drawMap(ctx); TRUCKS.forEach(k => drawTruck(ctx,k,t));
  const list = Object.values(players).filter(o => o.id === me.id || Date.now() - (o.hb||0) < 60000).sort((a,b) => a.y - b.y);
  for (const o of list){
    drawChar(ctx, o.x, o.y, o, o.m, t);
    if (o.f) drawFlag(ctx, o.f, o.x-16, o.y-92, t);
    if (o.s){
      ctx.fillStyle = "#6b4a2f"; ctx.fillRect(o.x+10, o.y-80, 3, 56);
      ctx.font = "bold 14px Impact, Arial Black, sans-serif"; ctx.textAlign = "center";
      const w = ctx.measureText(o.sg||"").width + 14;
      ctx.fillStyle = "#fffdf5"; ctx.strokeStyle = "#1d1b18"; ctx.lineWidth = 3;
      ctx.fillRect(o.x+11-w/2, o.y-100, w, 26); ctx.strokeRect(o.x+11-w/2, o.y-100, w, 26);
      ctx.fillStyle = COLORS[o.c] === "#f5c518" ? "#7a5c00" : "#a01818"; ctx.fillText(o.sg||"", o.x+11, o.y-81);
    }
    ctx.font = "bold 12px Trebuchet MS"; ctx.textAlign = "center";
    ctx.lineWidth = 4; ctx.strokeStyle = "rgba(255,255,255,.9)"; ctx.strokeText(o.n, o.x, o.y+16);
    ctx.fillStyle = "#1d1b18"; ctx.fillText(o.n, o.x, o.y+16);
    if (o.mic) ctx.fillText("🎤", o.x + ctx.measureText(o.n).width/2 + 10, o.y+16);
    if (o.msg && !mutedIds.has(o.id) && performance.now() - o.bt < 6000) bubble(ctx, o.msg, o.x, o.y - (o.s||o.f ? 108 : 52));
  }
  ctx.restore();
}
/* ===== Bandeiras ===== */
function star(c,cx,cy,r){c.fillStyle="#fff";c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.4:r;c.lineTo(cx+Math.cos(a)*q,cy+Math.sin(a)*q)}c.closePath();c.fill()}
function drawFlag(c,type,px,py,t){
  const w=54,h=36,x0=px-w,wv=i=>Math.sin(t/160+i/8)*2.5*((w-i)/w);
  const path=()=>{c.beginPath();for(let i=0;i<=w;i+=3)c.lineTo(x0+i,py+wv(i));for(let i=w;i>=0;i-=3)c.lineTo(x0+i,py+h+wv(i));c.closePath()};
  c.fillStyle="#6b4a2f";c.fillRect(px-1.5,py-2,3,72);
  c.save();path();c.clip();
  if(type==="br"){
    c.fillStyle="#009c3b";c.fillRect(x0,py-4,w,h+8);
    c.fillStyle="#ffdf00";c.beginPath();c.moveTo(x0+w/2,py+4);c.lineTo(x0+w-5,py+h/2);c.lineTo(x0+w/2,py+h-4);c.lineTo(x0+5,py+h/2);c.fill();
    c.fillStyle="#002776";c.beginPath();c.arc(x0+w/2,py+h/2,8,0,7);c.fill();
    c.strokeStyle="#fff";c.lineWidth=1.5;c.beginPath();c.arc(x0+w/2,py+h/2+12,12,Math.PI*1.2,Math.PI*1.8);c.stroke();
  } else { c.fillStyle="#d62828";c.fillRect(x0,py-4,w,h+8);star(c,x0+w/2,py+h/2+1,11); }
  c.restore();path();c.strokeStyle="#1d1b18";c.lineWidth=2;c.stroke();
}
const FL=["","br","pt"],FN=["nenhuma","Brasil","vermelha"];
$("bFlag").onclick=()=>{const i=(FL.indexOf(me.f)+1)%3;me.f=FL[i];players[me.id].f=me.f;myRef.update({f:me.f});$("bFlag").textContent="🚩 Bandeira: "+FN[i]};

/* ===== Lista de jogadores / silenciar ===== */
const mutedIds=new Set();
function renderList(){
  const L=$("plist");if(L.style.display!=="block")return;
  L.textContent="";
  Object.values(players).forEach(o=>{
    if(o.id===me.id)return;
    const r=document.createElement("div");r.className="row";
    const n=document.createElement("span");n.textContent=(o.c==="y"?"🟡 ":"🔴 ")+o.n+(o.mic?" 🎤":"");
    const b=document.createElement("button");b.textContent=mutedIds.has(o.id)?"Ouvir":"Silenciar";
    b.onclick=()=>{mutedIds.has(o.id)?mutedIds.delete(o.id):mutedIds.add(o.id);const P=peers[o.id];if(P&&P.audio)P.audio.muted=mutedIds.has(o.id);renderList()};
    r.append(n,b);L.appendChild(r);
  });
  if(!L.children.length)L.textContent="Ninguém mais na sala.";
}
$("bList").onclick=()=>{const L=$("plist");L.style.display=L.style.display==="block"?"none":"block";renderList()};

/* ===== Voz (WebRTC, sinalização pelo Firebase) ===== */
const peers={};let micStream=null,micTrack=null,micOn=false;
const ICE={iceServers:[{urls:"stun:stun.l.google.com:19302"},{urls:"stun:stun1.l.google.com:19302"}]};
function sinal(to,tipo,dados){db.ref("salas/"+room+"/sinais/"+to).push({de:me.id,tipo,dados:JSON.stringify(dados)})}
function getPeer(id){
  if(peers[id])return peers[id];
  const pc=new RTCPeerConnection(ICE),tr=pc.addTransceiver("audio",{direction:"sendrecv"});
  const P=peers[id]={pc,tr,pend:[],ok:false,audio:null};
  if(micTrack)tr.sender.replaceTrack(micTrack);
  pc.onicecandidate=e=>{if(e.candidate)sinal(id,"ice",e.candidate.toJSON())};
  pc.ontrack=e=>{if(P.audio)return;const a=new Audio();a.srcObject=e.streams[0]||new MediaStream([e.track]);a.muted=mutedIds.has(id);P.audio=a;a.play().catch(()=>{})};
  return P;
}
async function chamar(id){try{const P=getPeer(id),o=await P.pc.createOffer();await P.pc.setLocalDescription(o);sinal(id,"offer",P.pc.localDescription.toJSON())}catch(e){console.warn(e)}}
async function onSinal(s){
  const m=s.val();s.ref.remove();if(!m)return;
  const d=JSON.parse(m.dados),P=getPeer(m.de);
  const flush=async()=>{P.ok=true;for(const c of P.pend.splice(0))await P.pc.addIceCandidate(c)};
  try{
    if(m.tipo==="offer"){await P.pc.setRemoteDescription(d);await flush();const a=await P.pc.createAnswer();await P.pc.setLocalDescription(a);sinal(m.de,"answer",P.pc.localDescription.toJSON())}
    else if(m.tipo==="answer"){await P.pc.setRemoteDescription(d);await flush()}
    else if(m.tipo==="ice"){P.ok?await P.pc.addIceCandidate(d):P.pend.push(d)}
  }catch(e){console.warn(e)}
}
function closePeer(id){const P=peers[id];if(!P)return;try{P.pc.close()}catch(e){}if(P.audio)P.audio.srcObject=null;delete peers[id];mutedIds.delete(id)}
$("bMic").onclick=async()=>{
  if(!micOn){
    try{
      if(!micStream)micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
      micTrack=micStream.getAudioTracks()[0];micTrack.enabled=true;
      for(const id in peers)peers[id].tr.sender.replaceTrack(micTrack);
      micOn=true;
    }catch(e){addLog({sys:1,t:"Não foi possível usar o microfone. Permita o acesso no navegador (o site precisa estar em https)."});return}
  } else {micTrack.enabled=false;micOn=false}
  me.mic=micOn?1:0;myRef.update({mic:me.mic});
  $("bMic").textContent=micOn?"🎤 Microfone: ativo":"🎤 Microfone: mutado";
};

/* ===== Carros de som (YouTube) ===== */
const TRUCKS=[{id:"c1",n:"Carro de som 1",x:300,y:600,w:130,h:64},{id:"c2",n:"Carro de som 2",x:1300,y:600,w:130,h:64}];
const tst={},tpl={};let srvOff=0,trkMuted=false,near=null,lastU=0,ytOk=false;const ytQ=[];
function drawTruck(c,k,t){
  const x=k.x-k.w/2,y=k.y-k.h/2;
  c.fillStyle="rgba(0,0,0,.25)";c.fillRect(x+6,y+8,k.w,k.h);
  c.lineWidth=3;c.strokeStyle="#1d1b18";
  c.fillStyle="#e9e4d4";c.fillRect(x,y,k.w-34,k.h);c.strokeRect(x,y,k.w-34,k.h);
  c.fillStyle="#d62828";c.fillRect(x+k.w-34,y+14,34,k.h-14);c.strokeRect(x+k.w-34,y+14,34,k.h-14);
  c.fillStyle="#9fd3ea";c.fillRect(x+k.w-24,y+20,18,14);
  c.fillStyle="#1d1b18";c.fillRect(x+10,y-14,26,16);c.fillRect(x+50,y-14,26,16);
  c.beginPath();c.arc(x+28,y+k.h,9,0,7);c.arc(x+k.w-22,y+k.h,9,0,7);c.fill();
  c.font="bold 12px Impact,Arial Black,sans-serif";c.textAlign="center";c.fillText("CARRO DE SOM",x+(k.w-34)/2,y+k.h/2+5);
  if(tst[k.id]){c.strokeStyle="#f5c518";c.lineWidth=3;for(let i=0;i<3;i++){const r=10+((t/60+i*8)%24);c.globalAlpha=1-(r-10)/24;c.beginPath();c.arc(x+23,y-6,r,Math.PI*1.1,Math.PI*1.9);c.stroke()}c.globalAlpha=1;c.fillText("♪",x+80,y-22)}
}
const ys=document.createElement("script");ys.src="https://www.youtube.com/iframe_api";document.head.appendChild(ys);
window.onYouTubeIframeAPIReady=()=>{ytOk=true;ytQ.splice(0).forEach(f=>f())};
const wrap=document.createElement("div");wrap.style.cssText="position:fixed;left:-500px;top:0;width:200px;height:200px;overflow:hidden";document.body.appendChild(wrap);
const ytId=u=>{const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/|live\/)([\w-]{11})/);return m?m[1]:null};
function tocar(id){
  const s=tst[id],P=tpl[id];if(!P||!P.ready)return;
  if(!s){try{P.p.stopVideo()}catch(e){}P.title="";return}
  P.p.loadVideoById({videoId:s.vid,startSeconds:Math.max(0,(Date.now()+srvOff-s.t0)/1000)});P.p.unMute();
}
function mkPlayer(id){
  if(tpl[id])return tpl[id];
  const d=document.createElement("div");d.id="yt"+id;wrap.appendChild(d);
  const P=tpl[id]={ready:false,title:""};
  P.p=new YT.Player(d.id,{width:200,height:200,playerVars:Object.assign({playsinline:1,controls:0,enablejsapi:1},location.protocol.startsWith("http")?{origin:location.origin}:{}),events:{
    onReady:()=>{P.ready=true;tocar(id)},
    onError:e=>{const c=e.data;addLog({sys:1,t:c===101||c===150?"O dono desse vídeo bloqueou a reprodução fora do YouTube (erro "+c+"). Tente outro link.":c===153||location.protocol==="file:"?"O YouTube não toca com o arquivo aberto direto do computador (erro "+c+"). Hospede o jogo em https (ex.: Firebase Hosting) ou rode em localhost.":c===100?"Vídeo não encontrado ou privado (erro 100).":"Não foi possível tocar esse link (erro "+c+")."})},
    onStateChange:e=>{if(e.data===1){const v=P.p.getVideoData();if(v&&v.title)P.title=v.title}}}});
  return P;
}
function applyTruck(id,v){
  const key=v?v.vid+"_"+v.t0:"";
  if((tst[id]?tst[id].key:"")===key)return;
  tst[id]=v?{...v,key}:null;
  if(!v&&!tpl[id])return;
  const run=()=>{mkPlayer(id);tocar(id)};
  ytOk?run():ytQ.push(run);
}
function updTrucks(t){
  if(t-lastU<250)return;lastU=t;
  let nk=null,nd=1e9;
  for(const k of TRUCKS){
    const d=Math.hypot(me.x-k.x,me.y-k.y);if(d<nd){nd=d;nk=k}
    const P=tpl[k.id];
    if(P&&P.ready&&tst[k.id]){try{P.p.setVolume(trkMuted?0:Math.round(Math.max(0,Math.min(1,1-(d-100)/650))*100))}catch(e){}}
  }
  near=nd<190?nk:null;
  $("truckp").style.display=near?"block":"none";
  if(near){const s=tst[near.id],P=tpl[near.id];$("tnome").textContent=near.n;
    $("tstat").textContent=s?"Tocando: "+((P&&P.title)||"carregando…")+" (por "+s.por+")":"Parado. Cole um link do YouTube para tocar."}
}
$("tf").onsubmit=e=>{
  e.preventDefault();if(!near)return;
  const vid=ytId($("turl").value.trim());
  if(!vid){addLog({sys:1,t:"Link inválido. Cole o endereço de um vídeo do YouTube."});return}
  db.ref("salas/"+room+"/carros/"+near.id).set({vid,t0:firebase.database.ServerValue.TIMESTAMP,por:me.n});
  db.ref("salas/"+room+"/chat").push({sys:1,t:me.n+" colocou música no "+near.n,ts:Date.now()});
  $("turl").value="";$("turl").blur();
};
$("tstop").onclick=()=>{if(near)db.ref("salas/"+room+"/carros/"+near.id).remove()};
$("bTrk").onclick=()=>{trkMuted=!trkMuted;$("bTrk").textContent=trkMuted?"🔇 Carros: silenciados":"🔊 Carros: ligados"};

function initExtras(base){
  db.ref(".info/serverTimeOffset").on("value",s=>srvOff=s.val()||0);
  base.child("sinais/"+me.id).onDisconnect().remove();
  base.child("sinais/"+me.id).on("child_added",onSinal);
  base.child("carros").on("value",s=>{const v=s.val()||{};TRUCKS.forEach(k=>applyTruck(k.id,v[k.id]))});
  $("bFlag").textContent="🚩 Bandeira: "+FN[FL.indexOf(sel.f)];
}
